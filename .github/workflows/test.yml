name: Python CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run all unit tests
      run: python -m pytest tests/ -v

    - name: Verify Task1 on sample text
      run: |
        python -c "
        import sys; sys.path.insert(0, '.')
        from tasks.task1_run import extract_numerology, enrich
        text = open('data/raw/sample_ts38211.txt', encoding='utf-8').read()
        rows = enrich(extract_numerology(text))
        assert len(rows) == 7, f'Expected 7 rows, got {len(rows)}'
        print('Task1 sample verification: OK')
        "